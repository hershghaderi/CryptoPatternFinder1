name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Extract Project ZIP
      run: |
        echo "Unzipping project archive..."
        mkdir -p extracted_project
        unzip -o *.zip -d extracted_project
        TARGET_DIR=$(find extracted_project -name "build.gradle.kts" -o -name "build.gradle" | head -n 1 | xargs dirname)
        echo "PROJECT_PATH=$TARGET_DIR" >> $GITHUB_ENV

    - name: Fix Java Compatibility & Build
      run: |
        cd ${{ env.PROJECT_PATH }}
        
        # Override compileOptions to Java 17 if gradle file exists
        if [ -f "app/build.gradle" ]; then
          sed -i 's/sourceCompatibility JavaVersion.VERSION_1_8/sourceCompatibility JavaVersion.VERSION_17/g' app/build.gradle
          sed -i 's/targetCompatibility JavaVersion.VERSION_1_8/targetCompatibility JavaVersion.VERSION_17/g' app/build.gradle
        fi
        
        gradle assembleDebug -Dorg.gradle.java.home=$JAVA_HOME --no-daemon

    - name: Find and Rename APK
      run: |
        APK_PATH=$(find ${{ env.PROJECT_PATH }} -name "*.apk" | head -n 1)
        mkdir -p output_apk
        cp "$APK_PATH" output_apk/Hersh-CryptoPatternFinder.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Hersh-CryptoPatternFinder
        path: output_apk/Hersh-CryptoPatternFinder.apk
