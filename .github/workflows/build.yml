name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Find APK
        run: |
          echo "===== APK FILES ====="
          find . -type f -name "*.apk" -print
          echo "===================="

      - name: Verify APK
        run: |
          APK=$(find . -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          mkdir -p release
          cp "$APK" release/app-debug.apk

          echo "===== RELEASE ====="
          ls -lh release/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CryptoPatternFinder-APK
          path: release/app-debug.apk
          if-no-files-found: error
